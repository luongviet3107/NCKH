services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      ENVIRONMENT: production
      DATABASE_URL: sqlite:////app/runtime/autods.db
      CORS_ORIGINS: http://localhost:8080
      SEED_DEMO_DATA: "true"
      MAX_UPLOAD_MB: "50"
      MAX_AGENT_RUNTIME_SECONDS: "300"
    volumes:
      - autods_runtime:/app/runtime
      - autods_uploads:/app/backend/data
      - autods_datasets:/app/datasets
      - autods_reports:/app/reports
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  autods_runtime:
  autods_uploads:
  autods_datasets:
  autods_reports:
